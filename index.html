  gulangyu:['鼓浪嶼',24.446318,118.066232],architecture:['萬國建築博覽',24.443933,118.06843],shuzhuang:['菽莊花園景區',24.444489,118.068677],piano:['鋼琴博物館',24.439535,118.06903],zhongshan:['中山路步行街',24.45391,118.0799],

};

 ['D1','啟程・跨海',['airport','waterhead','wutong','hotel']],['D2','鼓浪嶼慢步',['gulangyu','architecture','shuzhuang','piano','zhongshan','hotel']],['D3','城市與歡樂',['eastport','ringeast','circus','zoo','jimei','hotel']],['D4','廈門風景',['museum','ringroad','hotel']],['D5','自由探索',['hotel']],['D6','平安返程',['hotel','wutong','waterhead','airport']]
],guide:[
 ['鼓浪嶼：一座會說故事的島','GULANGYU','鼓浪嶼以安靜巷弄、老別墅和音樂氣息著名。近代曾是多國人群往來的港口，因此留下各式建築語彙；旅行時不妨放下導航，循著坡道、樹影與琴聲散步。','gulangyu'],
 ['菽莊花園與鋼琴博物館','MUSIC & GARDEN','菽莊花園依山面海，巧妙地把庭園、海景與岩石收進視線。園內的鋼琴博物館，則讓鼓浪嶼「音樂之島」的稱號有了具體的註腳。','shuzhuang'],
 ['集美學村：嘉庚風格的校園與聚落','JIMEI','集美學村以陳嘉庚倡辦教育的歷史聞名。紅磚牆、閩南屋脊與西式比例交織成獨特的「嘉庚風格」，是城市景觀中很有辨識度的一頁。','jimei'],
 ['環島路：把海留給慢行','COASTLINE','沿著廈門海岸的環島路，最適合用不趕時間的方式感受。海風、綠地和遠方的浪線，讓這段路成為行程裡的留白。','ringroad']
]};
let trip=JSON.parse(localStorage.getItem(STORE)||'null')||seed,day=0,editDay=0,guideEdit=0;
function normaliseDay(d){if(!Array.isArray(d))return d;return {label:d[0],title:d[1],stops:d[2].map(k=>{let p=places[k];return {name:p[0],lat:p[1],lng:p[2],time:''}})}}
function normaliseGuide(g){if(!Array.isArray(g))return g;let p=places[g[3]];return {title:g[0],tag:g[1],body:g[2],place:g[3],lat:p[1],lng:p[2]}}
trip.days=trip.days.map(normaliseDay);

trip.banner=trip.banner||seed.banner;

function saveLocalTrip(){localStorage.setItem(STORE,JSON.stringify(trip));localStorage.setItem(DRAFT_KEY,'1')}
function renderTrip(){renderMeta();renderDays();renderGuide()}
const e=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const mapUrl=p=>`https://www.google.com/maps/search/?api=1&query=${p[1]},${p[2]}`;

function renderMeta(){dateText.textContent=trip.dates;bannerLabel.textContent=trip.banner.label;bannerTitle.innerHTML=e(trip.banner.title).replace(/\n/g,'<br>');meta.innerHTML=`<div class="bg-white soft rounded-2xl p-4"><p class="text-xs text-stone-500 mb-2"><i class="fa-solid fa-plane text-clay mr-1"></i>航班／船班</p><p class="text-sm whitespace-pre-line">${e(trip.flight)}</p></div><div class="bg-white soft rounded-2xl p-4"><p class="text-xs text-stone-500 mb-2"><i class="fa-solid fa-bed text-clay mr-1"></i>住宿</p><p class="text-sm whitespace-pre-line">${e(trip.hotel)}</p><a class="text-xs text-moss font-semibold inline-block mt-2" target="_blank" rel="noopener" href="${mapUrl(places.hotel)}"><i class="fa-solid fa-location-dot mr-1"></i>導航至飯店</a></div>`}
function renderDays(){tabs.innerHTML=trip.days.map((d,i)=>`<button onclick="pick(${i})" class="shrink-0 px-4 py-2 rounded-full text-sm ${i===day?'bg-moss text-white':'bg-white text-stone-500'}">${e(d.label)}</button>`).join('');let d=trip.days[day];itinerary.innerHTML=`<div class="mb-4"><p class="text-xs tracking-widest text-clay">${e(d.label)}</p><h3 class="font-serif text-2xl">${e(d.title)}</h3></div>${d.stops.length?d.stops.map((p,i)=>{let transport=/機場|港|碼頭/.test(p.name);let hasMap=Number.isFinite(+p.lat)&&Number.isFinite(+p.lng);return `<article class="timeline relative pl-14 pb-6"><span class="absolute left-0 top-0 w-12 h-12 grid place-items-center rounded-full ${transport?'bg-clay text-white':'bg-sand text-moss'} text-xs font-semibold">${e(p.time||i+1)}</span><div class="bg-white rounded-2xl p-4 soft"><h4 class="font-semibold">${e(p.name)}</h4>${transport?'<p class="text-xs text-clay mt-1">交通節點・請依領隊通知確認集合時間</p>':''}${hasMap?`<a target="_blank" rel="noopener" href="${mapUrl(['',+p.lat,+p.lng])}" class="inline-block mt-3 text-xs font-semibold text-moss"><i class="fa-solid fa-map-location-dot mr-1"></i>開啟 Google Maps</a>`:''}</div></article>`}).join(''):'<div class="bg-white rounded-2xl p-5 text-sm text-stone-500 soft">尚未安排景點，點選「編輯行程」新增。</div>'}`}
function pick(i){day=i;renderDays()}
function renderGuide(){guides.innerHTML=trip.guide.length?trip.guide.map(g=>{let hasMap=Number.isFinite(+g.lat)&&Number.isFinite(+g.lng),p=['',+g.lat,+g.lng];return `<article class="bg-white rounded-[2rem] overflow-hidden soft"><div class="p-5"><p class="text-xs tracking-[.18em] text-clay">${e(g.tag)}</p><h3 class="font-serif text-2xl mt-1">${e(g.title)}</h3><p class="guide-copy text-sm mt-4">${e(g.body)}</p>${hasMap?`<a target="_blank" rel="noopener" href="${mapUrl(p)}" class="inline-block mt-4 text-xs font-semibold text-moss"><i class="fa-solid fa-location-dot mr-1"></i>查看位置</a>`:''}</div>${hasMap?`<iframe title="${e(g.title)} 地圖" loading="lazy" class="border-0 w-full h-48" src="${osm(p)}"></iframe>`:''}</article>`}).join(''):'<div class="bg-white rounded-[2rem] p-5 text-sm text-stone-500 soft">尚未建立導覽文章，點選「編輯 GUIDE」開始新增。</div>'}
let checks=JSON.parse(localStorage.getItem('jinxia-checks')||'null')||['護照','身分證','台胞證','手機與充電線','行動電源','常備藥品'].map(name=>({name,done:false}));
function renderChecks(){checksEl=checks;checksDiv=document.getElementById('checks');checksDiv.innerHTML=checks.map((x,i)=>`<label class="flex gap-3 items-center p-2 rounded-xl hover:bg-paper"><input class="check accent-moss" type="checkbox" ${x.done?'checked':''} onchange="toggle(${i})"><span class="text-sm flex-1">${e(x.name)}</span><button onclick="event.preventDefault();del(${i})" class="text-stone-300"><i class="fa-solid fa-xmark"></i></button></label>`).join('');counter.textContent=`${checks.filter(x=>x.done).length} / ${checks.length} 完成`}
function persistChecks(){localStorage.setItem('jinxia-checks',JSON.stringify(checks));renderChecks()}function toggle(i){checks[i].done=!checks[i].done;persistChecks()}function del(i){checks.splice(i,1);persistChecks()}function addCheck(){let n=newCheck.value.trim();if(n){checks.push({name:n,done:false});newCheck.value='';persistChecks()}}

function openEdit(){eBannerLabel.value=trip.banner.label;eBannerTitle.value=trip.banner.title;eDates.value=trip.dates;eFlight.value=trip.flight;eHotel.value=trip.hotel;edit.classList.add('show')}function closeEdit(){edit.classList.remove('show')}function saveMeta(){trip.banner={label:eBannerLabel.value.trim()||seed.banner.label,title:eBannerTitle.value.trim()||seed.banner.title};trip.dates=eDates.value.trim()||seed.dates;trip.flight=eFlight.value.trim()||seed.flight;trip.hotel=eHotel.value.trim()||seed.hotel;saveLocalTrip();renderMeta();closeEdit()}
function openPlanner(){editDay=Math.min(day,trip.days.length-1);renderPlanner();planner.classList.add('show')}
function closePlanner(){planner.classList.remove('show')}
function renderPlanner(){plannerDays.innerHTML=trip.days.map((d,i)=>`<button onclick="chooseEditDay(${i})" class="shrink-0 px-3 py-2 rounded-full text-sm ${i===editDay?'bg-moss text-white':'bg-white text-stone-500'}">${e(d.label)}</button>`).join('');let d=trip.days[editDay];plannerBody.innerHTML=`<div class="grid grid-cols-[90px_1fr] gap-3 mt-3"><label class="text-sm pt-3">天數標示</label><input id="planLabel" value="${e(d.label)}" class="bg-white border border-sand rounded-xl p-3 text-sm"><label class="text-sm pt-3">主題</label><input id="planTitle" value="${e(d.title)}" class="bg-white border border-sand rounded-xl p-3 text-sm"></div><div class="flex justify-between items-center mt-6 mb-2"><h3 class="font-semibold">當日景點</h3><button onclick="addStop()" class="text-xs text-moss font-semibold"><i class="fa-solid fa-plus mr-1"></i>新增景點</button></div><div class="space-y-3">${d.stops.map((p,i)=>`<div class="bg-white rounded-2xl p-4 border border-sand"><div class="flex gap-2"><input data-f="name" data-i="${i}" value="${e(p.name)}" class="changeStop min-w-0 flex-1 border-b border-sand pb-2 text-sm outline-none" placeholder="景點或活動名稱"><button onclick="moveStop(${i},-1)" class="text-stone-400" aria-label="上移"><i class="fa-solid fa-arrow-up"></i></button><button onclick="moveStop(${i},1)" class="text-stone-400" aria-label="下移"><i class="fa-solid fa-arrow-down"></i></button><button onclick="deleteStop(${i})" class="text-clay" aria-label="刪除"><i class="fa-solid fa-trash"></i></button></div><div class="grid grid-cols-3 gap-2 mt-3"><input data-f="time" data-i="${i}" value="${e(p.time||'')}" class="changeStop min-w-0 bg-paper rounded-lg px-2 py-2 text-xs outline-none" placeholder="時間"><input data-f="lat" data-i="${i}" value="${p.lat??''}" inputmode="decimal" class="changeStop min-w-0 bg-paper rounded-lg px-2 py-2 text-xs outline-none" placeholder="緯度"><input data-f="lng" data-i="${i}" value="${p.lng??''}" inputmode="decimal" class="changeStop min-w-0 bg-paper rounded-lg px-2 py-2 text-xs outline-none" placeholder="經度"></div></div>`).join('')}</div><button onclick="deleteDay()" class="mt-5 text-sm text-clay"><i class="fa-solid fa-trash mr-1"></i>刪除這一天</button>`;document.querySelectorAll('.changeStop').forEach(x=>x.oninput=()=>{let p=trip.days[editDay].stops[+x.dataset.i];p[x.dataset.f]=x.dataset.f==='lat'||x.dataset.f==='lng'?(x.value===''?null:Number(x.value)):x.value})}
function storeDayHeader(){if(!trip.days[editDay]||!planLabel)return;trip.days[editDay].label=planLabel.value.trim()||'D'+(editDay+1);trip.days[editDay].title=planTitle.value.trim()||'未命名行程'}
function chooseEditDay(i){storeDayHeader();editDay=i;renderPlanner()}
function addDay(){storeDayHeader();let n=trip.days.length+1;trip.days.push({label:'D'+n,title:'新的一天',stops:[]});editDay=trip.days.length-1;renderPlanner()}
function deleteDay(){storeDayHeader();if(trip.days.length===1){alert('至少保留一天行程');return}trip.days.splice(editDay,1);editDay=Math.max(0,editDay-1);renderPlanner()}
function addStop(){trip.days[editDay].stops.push({name:'新景點',time:'',lat:null,lng:null});renderPlanner()}
function deleteStop(i){trip.days[editDay].stops.splice(i,1);renderPlanner()}
function moveStop(i,by){let a=trip.days[editDay].stops,j=i+by;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];renderPlanner()}
function savePlan(){storeDayHeader();trip.days.forEach((x,i)=>{if(!x.label.trim())x.label='D'+(i+1)});day=Math.min(day,trip.days.length-1);saveLocalTrip();renderDays();closePlanner()}
function openGuideEditor(){guideEdit=Math.min(guideEdit,trip.guide.length-1);if(guideEdit<0)guideEdit=0;renderGuideEditor();guideEditor.classList.add('show')}
function closeGuideEditor(){guideEditor.classList.remove('show')}
function renderGuideEditor(){if(!trip.guide.length){guideEditorTabs.innerHTML='';guideEditorBody.innerHTML='<div class="mt-5 bg-white rounded-2xl p-5 text-sm text-stone-500">尚無文章。請點選下方「新增文章」。</div>';return}guideEditorTabs.innerHTML=trip.guide.map((g,i)=>`<button onclick="chooseGuide(${i})" class="shrink-0 px-3 py-2 rounded-full text-sm ${i===guideEdit?'bg-moss text-white':'bg-white text-stone-500'}">${e(g.tag||'GUIDE '+(i+1))}</button>`).join('');let g=trip.guide[guideEdit];guideEditorBody.innerHTML=`<div class="space-y-3 mt-4"><label class="block text-sm">標題<input id="gTitle" value="${e(g.title)}" class="guideField mt-1 w-full bg-white border border-sand rounded-xl p-3 text-sm" placeholder="例如：鼓浪嶼慢步"></label><label class="block text-sm">分類標籤<input id="gTag" value="${e(g.tag)}" class="guideField mt-1 w-full bg-white border border-sand rounded-xl p-3 text-sm" placeholder="例如：GULANGYU"></label><label class="block text-sm">導覽內容<textarea id="gBody" rows="7" class="guideField mt-1 w-full bg-white border border-sand rounded-xl p-3 text-sm leading-7" placeholder="寫下景點故事、提醒或推薦…">${e(g.body)}</textarea></label><div class="grid grid-cols-2 gap-3"><label class="block text-sm">緯度<input id="gLat" value="${g.lat??''}" inputmode="decimal" class="guideField mt-1 w-full bg-white border border-sand rounded-xl p-3 text-sm" placeholder="24.446318"></label><label class="block text-sm">經度<input id="gLng" value="${g.lng??''}" inputmode="decimal" class="guideField mt-1 w-full bg-white border border-sand rounded-xl p-3 text-sm" placeholder="118.066232"></label></div><p class="text-xs text-stone-500">經緯度留白即可建立純文字導覽；填入後會顯示地圖與導航。</p></div><button onclick="deleteGuide()" class="mt-5 text-sm text-clay"><i class="fa-solid fa-trash mr-1"></i>刪除這篇文章</button>`;document.querySelectorAll('.guideField').forEach(x=>x.oninput=storeGuide)}
function storeGuide(){if(!trip.guide[guideEdit]||!gTitle)return;let g=trip.guide[guideEdit];g.title=gTitle.value.trim()||'未命名導覽';g.tag=gTag.value.trim()||'GUIDE';g.body=gBody.value;g.lat=gLat.value===''?null:Number(gLat.value);g.lng=gLng.value===''?null:Number(gLng.value)}
function chooseGuide(i){storeGuide();guideEdit=i;renderGuideEditor()}
function addGuide(){storeGuide();trip.guide.push({title:'新導覽文章',tag:'NEW GUIDE',body:'',lat:null,lng:null});guideEdit=trip.guide.length-1;renderGuideEditor()}
function deleteGuide(){trip.guide.splice(guideEdit,1);guideEdit=Math.max(0,guideEdit-1);renderGuideEditor()}
function saveGuides(){storeGuide();saveLocalTrip();renderGuide();closeGuideEditor()}
function cloudButton(){let owner=cloudSession?.user?.email===OWNER_EMAIL;cloudBtn.innerHTML=owner?'<i class="fa-solid fa-cloud-arrow-up mr-1"></i>發布':'<i class="fa-solid fa-cloud mr-1"></i>同步';cloudBtn.title=owner?'發布共用更新':'登入後發布'} 
async function loadSharedTrip(){if(!cloud||localStorage.getItem(DRAFT_KEY)==='1')return;let {data,error}=await cloud.from('trip_content').select('payload').eq('id',1).maybeSingle();if(error){console.warn('Shared trip unavailable:',error.message);return}if(data?.payload){trip=data.payload;normaliseTrip();localStorage.setItem(STORE,JSON.stringify(trip));renderTrip()}}
async function cloudAction(){if(!cloud){alert('共用資料服務尚未載入，請確認網路後重試。');return}if(cloudSession?.user?.email===OWNER_EMAIL){await publishSharedTrip();return}if(cloudSession){alert('目前登入帳號不是管理者，僅可查看共用內容。');return}openLogin()}
function openLogin(){loginEmail.value=OWNER_EMAIL;loginPassword.value='';loginMessage.textContent='';loginModal.classList.add('show')}
function closeLogin(){loginModal.classList.remove('show')}
async function passwordLogin(){let email=loginEmail.value.trim(),password=loginPassword.value;if(email!==OWNER_EMAIL){loginMessage.textContent='請使用管理者 Email 登入。';return}if(!password){loginMessage.textContent='請輸入密碼。';return}loginMessage.textContent='登入中…';let {data,error}=await cloud.auth.signInWithPassword({email,password});if(error){loginMessage.textContent='登入失敗：'+error.message;return}cloudSession=data.session;cloudButton();closeLogin();alert('登入成功。現在可按右上角「發布」分享更新。')}
async function publishSharedTrip(){if(cloudSession?.user?.email!==OWNER_EMAIL){alert('請先以管理者帳號登入。');return}cloudBtn.disabled=true;cloudBtn.textContent='發布中…';let {error}=await cloud.from('trip_content').upsert({id:1,payload:trip,updated_at:new Date().toISOString()});cloudBtn.disabled=false;cloudButton();if(error){alert('發布失敗：'+error.message)}else{localStorage.removeItem(DRAFT_KEY);alert('已發布共用更新。其他人重新整理網址後即可看到最新版。')}}
async function initCloud(){if(!window.supabase)return;cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let {data:{session}}=await cloud.auth.getSession();cloudSession=session;cloudButton();await loadSharedTrip();cloud.auth.onAuthStateChange((_event,session)=>{cloudSession=session;cloudButton()})}
document.querySelectorAll('.navBtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.page).classList.add('active');document.querySelectorAll('.navBtn').forEach(x=>x.className='navBtn text-stone-400 py-2 text-xs');b.className='navBtn text-moss py-2 text-xs';window.scrollTo({top:0,behavior:'smooth'})});share.onclick=async()=>{try{await navigator.share({title:'金廈員旅',url:location.href})}catch(_){navigator.clipboard?.writeText(location.href)}};addEventListener('scroll',()=>document.documentElement.style.setProperty('--p',(scrollY/(document.documentElement.scrollHeight-innerHeight)*100||0)+'%'));if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});renderMeta();renderDays();renderGuide();renderChecks();showLinks();
cloudBtn.onclick=cloudAction;initCloud();
</script>
</body></html>
